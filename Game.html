<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race to 100</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    text-align: center;
    min-height: 100vh;
}

header {
    padding: 14px 10px;
    background: #0b1220;
}

h1 {
    margin: 4px 0;
    font-size: clamp(24px, 5vw, 38px);
}

.subtitle {
    color: #b8c5d8;
    margin: 5px;
}

#status {
    margin: 10px auto;
    padding: 10px;
    font-weight: bold;
    color: #ffe082;
}

.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 8px;
    min-height: 220px;
}

.player {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    padding: 20px 8px;
    min-width: 0;
    transition: 0.25s;
    border: 3px solid transparent;
}

.player-a {
    background: linear-gradient(145deg, #087f8c, #064e65);
}

.player-b {
    background: linear-gradient(145deg, #8d3cce, #51208b);
}

.player.active {
    border-color: #fff59d;
    box-shadow: 0 0 20px #fff59d88;
    transform: scale(1.01);
}

.watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(55px, 12vw, 110px);
    font-weight: 900;
    color: #ffffff;
    opacity: 0.09;
    pointer-events: none;
    white-space: nowrap;
}

.player h2,
.player .score,
.player .turn-label {
    position: relative;
    z-index: 1;
}

.player h2 {
    margin: 0 0 12px;
    font-size: clamp(18px, 4vw, 27px);
}

.score {
    font-size: clamp(42px, 9vw, 68px);
    font-weight: bold;
}

.turn-label {
    margin-top: 8px;
    font-size: 14px;
    font-weight: bold;
    min-height: 18px;
}

.middle {
    margin: 8px;
    padding: 14px;
    background: #202c40;
    border: 1px solid #40506b;
    border-radius: 16px;
}

.middle h2 {
    margin: 0 0 8px;
    font-size: 20px;
}

.total {
    font-size: clamp(36px, 8vw, 55px);
    font-weight: bold;
    color: #ffe082;
}

.progress-track {
    max-width: 500px;
    height: 12px;
    margin: 10px auto;
    background: #0b1220;
    border-radius: 20px;
    overflow: hidden;
}

#progress {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #19d3c5, #ffe082);
    transition: width 0.35s;
}

.history-box {
    margin: 12px auto 0;
    max-width: 600px;
    text-align: left;
}

.history-box h3 {
    text-align: center;
    margin: 5px 0 8px;
}

#history {
    max-height: 125px;
    overflow-y: auto;
    padding: 8px;
    border-radius: 10px;
    background: #111a2a;
}

.move {
    padding: 7px;
    margin: 4px 0;
    border-radius: 6px;
    background: #27354b;
    font-size: 14px;
}

.move.a {
    border-left: 4px solid #19d3c5;
}

.move.b {
    border-left: 4px solid #c084fc;
}

.controls {
    margin: 12px 8px 0;
    padding: 14px 8px;
    border-radius: 18px;
    background: #0b1220;
    border: 1px solid #334155;
}

.controls h2 {
    margin: 0 0 12px;
    font-size: 20px;
}

.number-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(45px, 1fr));
    gap: 10px;
    max-width: 460px;
    margin: auto;
}

.number-btn {
    width: 100%;
    aspect-ratio: 1;
    max-width: 68px;
    justify-self: center;
    border-radius: 50%;
    border: 3px solid #e2e8f0;
    background: #19a7a0;
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
    box-shadow: 0 4px 0 #075e60;
}

.number-btn:hover:not(:disabled) {
    transform: translateY(-3px);
}

.number-btn:active:not(:disabled) {
    transform: scale(0.93);
}

.number-btn.player-b-color {
    background: #a855f7;
    box-shadow: 0 4px 0 #6b21a8;
}

.number-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

#reset {
    margin-top: 14px;
    padding: 11px 24px;
    border: 0;
    border-radius: 10px;
    background: #fbbf24;
    color: #1e293b;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#reset:hover {
    background: #fde68a;
}

#winScreen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #07111fee;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

#winScreen.show {
    display: flex;
}

.win-card {
    padding: 35px 20px;
    width: min(440px, 100%);
    border-radius: 24px;
    background: linear-gradient(145deg, #1c3554, #51208b);
    border: 2px solid #ffe082;
    animation: pop 0.5s ease-out;
}

.win-card h2 {
    font-size: clamp(30px, 8vw, 48px);
    margin: 8px;
}

.trophy {
    font-size: 65px;
    animation: bounce 0.8s infinite alternate;
}

#winDetails {
    font-size: 18px;
    line-height: 1.6;
}

.confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 15px;
    z-index: 11;
    pointer-events: none;
    animation: fall 2.8s linear forwards;
}

@keyframes pop {
    from { transform: scale(0.65); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

@keyframes bounce {
    from { transform: translateY(0) rotate(-8deg); }
    to { transform: translateY(-12px) rotate(8deg); }
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

@media (max-width: 380px) {
    .players {
        gap: 5px;
        padding: 5px;
    }

    .player {
        padding: 16px 4px;
    }

    .number-grid {
        gap: 7px;
    }

    .number-btn {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🏁 RACE TO 100</h1>
    <p class="subtitle">Choose a number. Take turns. Reach 100 first!</p>
</header>

<div id="status">Player A's turn — choose a number!</div>

<section class="players">
    <div class="player player-a active" id="playerA">
        <div class="watermark">A</div>
        <h2>🔵 PLAYER A</h2>
        <div class="score" id="scoreA">0</div>
        <div class="turn-label" id="labelA">YOUR TURN</div>
    </div>

    <div class="player player-b" id="playerB">
        <div class="watermark">B</div>
        <h2>🟣 PLAYER B</h2>
        <div class="score" id="scoreB">0</div>
        <div class="turn-label" id="labelB">WAITING</div>
    </div>
</section>

<section class="middle">
    <h2>📊 RUNNING TOTAL</h2>
    <div class="total" id="total">0 / 100</div>

    <div class="progress-track">
        <div id="progress"></div>
    </div>

    <div id="lastMove">No moves yet. Start the game!</div>

    <div class="history-box">
        <h3>📝 Move History</h3>
        <div id="history" aria-live="polite">
            <div class="move">The game has not started.</div>
        </div>
    </div>
</section>

<section class="controls">
    <h2>🔢 Choose a Number (1–10)</h2>
    <div class="number-grid" id="numberGrid"></div>
    <button id="reset">🔄 Restart Game</button>
</section>

<div id="winScreen" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="win-card">
        <div class="trophy">🏆</div>
        <h2 id="winTitle">PLAYER A WINS!</h2>
        <p id="winDetails"></p>
        <button id="playAgain" type="button"
            style="padding:12px 24px;border:0;border-radius:10px;
            background:#ffe082;font-size:17px;font-weight:bold;cursor:pointer;">
            Play Again
        </button>
    </div>
</div>

<script>
const TARGET = 100;

let total = 0;
let currentPlayer = "A";
let moveNumber = 0;
let gameOver = false;
let scores = { A: 0, B: 0 };
let moveHistory = [];

const status = document.getElementById("status");
const totalDisplay = document.getElementById("total");
const historyBox = document.getElementById("history");
const lastMove = document.getElementById("lastMove");
const winScreen = document.getElementById("winScreen");

const numberGrid = document.getElementById("numberGrid");
const buttons = [];

// Create buttons numbered 1 through 10.
for (let number = 1; number <= 10; number++) {
    const button = document.createElement("button");

    button.className = "number-btn";
    button.textContent = number;
    button.type = "button";
    button.setAttribute("aria-label", "Choose " + number);

    button.addEventListener("click", () => playMove(number));

    numberGrid.appendChild(button);
    buttons.push(button);
}

function playMove(number) {
    if (gameOver) return;

    const player = currentPlayer;
    const oldTotal = total;

    total += number;
    scores[player] += number;
    moveNumber++;

    const record = {
        move: moveNumber,
        player: player,
        number: number,
        oldTotal: oldTotal,
        newTotal: total
    };

    moveHistory.push(record);

    // Change all number buttons to the colour of the next player.
    const nextPlayer = player === "A" ? "B" : "A";

    buttons.forEach(button => {
        button.classList.toggle("player-b-color", nextPlayer === "B");
    });

    updateDisplay(record);

    // The player who reaches or passes 100 wins immediately.
    if (total >= TARGET) {
        finishGame(player);
        return;
    }

    currentPlayer = nextPlayer;
    updateTurn();
}

function updateDisplay(record) {
    document.getElementById("scoreA").textContent = scores.A;
    document.getElementById("scoreB").textContent = scores.B;

    totalDisplay.textContent = total + " / " + TARGET;

    document.getElementById("progress").style.width =
        Math.min((total / TARGET) * 100, 100) + "%";

    lastMove.textContent =
        "Player " + record.player + " chose " + record.number +
        ": " + record.oldTotal + " + " + record.number +
        " = " + record.newTotal;

    renderHistory();
}

function renderHistory() {
    historyBox.innerHTML = "";

    moveHistory.forEach(record => {
        const row = document.createElement("div");

        row.className = "move " + record.player.toLowerCase();

        row.textContent =
            "Move " + record.move +
            " — Player " + record.player +
            " chose " + record.number +
            " | " + record.oldTotal + " + " +
            record.number + " = " + record.newTotal;

        historyBox.appendChild(row);
    });

    historyBox.scrollTop = historyBox.scrollHeight;
}

function updateTurn() {
    document.getElementById("playerA").classList.toggle(
        "active", currentPlayer === "A"
    );

    document.getElementById("playerB").classList.toggle(
        "active", currentPlayer === "B"
    );

    document.getElementById("labelA").textContent =
        currentPlayer === "A" ? "YOUR TURN" : "WAITING";

    document.getElementById("labelB").textContent =
        currentPlayer === "B" ? "YOUR TURN" : "WAITING";

    status.textContent =
        "Player " + currentPlayer + "'s turn — choose a number!";

    status.style.color = currentPlayer === "A" ? "#5eead4" : "#d8b4fe";
}

function finishGame(player) {
    gameOver = true;

    status.textContent = "🎉 Player " + player + " has won!";
    document.getElementById("labelA").textContent =
        player === "A" ? "🏆 WINNER!" : "GAME OVER";

    document.getElementById("labelB").textContent =
        player === "B" ? "🏆 WINNER!" : "GAME OVER";

    buttons.forEach(button => button.disabled = true);

    document.getElementById("winTitle").textContent =
        "PLAYER " + player + " WINS!";

    document.getElementById("winDetails").textContent =
        "Congratulations! Player " + player +
        " reached a total of " + total +
        " in " + moveNumber + " moves. Great game!";

    winScreen.classList.add("show");
    createConfetti();
}

function createConfetti() {
    const symbols = ["🎉", "✨", "⭐", "🏆"];

    for (let i = 0; i < 45; i++) {
        const piece = document.createElement("div");

        piece.className = "confetti";
        piece.textContent = symbols[
            Math.floor(Math.random() * symbols.length)
        ];

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.animationDelay = Math.random() * 1.5 + "s";
        piece.style.fontSize = (12 + Math.random() * 18) + "px";

        document.body.appendChild(piece);

        setTimeout(() => piece.remove(), 4500);
    }
}

function restartGame() {
    total = 0;
    currentPlayer = "A";
    moveNumber = 0;
    gameOver = false;
    scores = { A: 0, B: 0 };
    moveHistory = [];

    document.getElementById("scoreA").textContent = "0";
    document.getElementById("scoreB").textContent = "0";
    totalDisplay.textContent = "0 / 100";
    document.getElementById("progress").style.width = "0%";

    lastMove.textContent = "No moves yet. Start the game!";
    historyBox.innerHTML =
        '<div class="move">The game has not started.</div>';

    buttons.forEach(button => {
        button.disabled = false;
        button.classList.remove("player-b-color");
    });

    winScreen.classList.remove("show");

    document.querySelectorAll(".confetti").forEach(piece => piece.remove());

    updateTurn();
}

document.getElementById("reset").addEventListener("click", restartGame);
document.getElementById("playAgain").addEventListener("click", restartGame);

updateTurn();
</script>

</body>
</html>
